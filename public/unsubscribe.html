<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>И-мэйлээс гарах · Stars Karaoke</title>
<link rel="stylesheet" href="style.css">
<style>
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding:4rem 1.25rem;text-align:center}
</style>
</head>
<body>
<main>
    <p style="letter-spacing:.3em;font-size:.8rem;color:var(--mute)">STARS KARAOKE</p>
    <h2>И-мэйлээс гарах</h2>

    <div id="ask">
        <p>Урамшуулал, мэдээний и-мэйл хүлээн авахаа зогсоохыг хүсэж байна уу?</p>
        <button class="btn" id="go" type="button">Бүртгэлээ цуцлах</button>
    </div>

    <p id="out" aria-live="polite"></p>

    <p><a href="index.html">← Нүүр хуудас</a> · <a href="privacy.html">Нууцлалын бодлого</a></p>
</main>

<script>
var API = (location.port === '5500' || location.port === '5501')
    ? 'http://' + location.hostname + ':8000'
    : '';

var token = new URLSearchParams(location.search).get('token') || '';
var out = document.getElementById('out');
var go = document.getElementById('go');

if (!token) {
    document.getElementById('ask').hidden = true;
    out.textContent = 'Холбоос буруу байна. И-мэйл доторх холбоосыг дахин дарна уу, эсвэл sanchiravarga52@gmail.com руу бичнэ үү.';
}

go.addEventListener('click', function() {
    go.disabled = true;
    out.textContent = 'Түр хүлээнэ үү...';

    fetch(API + '/api/unsubscribe', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token: token})
    })
    .then(function(r) {
        if (!r.ok) throw new Error('fail');
        document.getElementById('ask').hidden = true;
        out.textContent = 'Та амжилттай бүртгэлээс гарлаа. Бид танд маркетингийн и-мэйл илгээхгүй.';
    })
    .catch(function() {
        go.disabled = false;
        out.textContent = 'Алдаа гарлаа. Дахин оролдоно уу эсвэл sanchiravarga52@gmail.com руу бичнэ үү.';
    });
});
</script>
</body>
</html>
